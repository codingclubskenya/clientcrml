name: Flutter CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Static Analysis
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      - name: Build Web Application
        run: flutter build web --release

      - name: Build APK
        run: flutter build apk --release

      - name: Deploy Web Application
        run: |
          sudo cp -r build/web/* /var/www/html/bizx/
          sudo systemctl reload nginx

      - name: Deploy APK
        run: |
          mkdir -p /home/client/clientapps/crm
          cp build/app/outputs/flutter-apk/app-release.apk /home/client/clientapps/crm/bizx.apk
