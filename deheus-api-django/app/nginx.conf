server {
    listen 443 ssl http2;
    server_name codingclubskenya.com;

    # SSL (managed by certbot)
    ssl_certificate /etc/letsencrypt/live/codingclubskenya.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codingclubskenya.com/privkey.pem;

    # Static files
    location /static/ {
        alias /home/devops/deheus-api-django/static/;
        expires 30d;
    }

    # Django API (port 8000)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check
    location /health {
        proxy_pass http://127.0.0.1:8000/api/health/;
    }
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name codingclubskenya.com;
    return 301 https://$host$request_uri;
}
